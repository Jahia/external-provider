configName=VFS mount points
configDesc=Settings for the VFS mount points of the external provider module.

vfsMountPoint_allowedSchemes=Allowed root path schemes
vfsMountPoint_allowedSchemes.desc=The URI schemes the root path of a VFS mount point may use. The local file system (file) is the default. Name a further scheme here when a mount point needs it. Keep file in the list: this setting also governs the source folder of a module deployed in source-folders mode, which is read from the local file system.
